<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>new-polybot monitor</title>
<style>
  :root{
    --bg:#0b0f14; --card:#131a23; --card2:#18212c; --line:#233041;
    --tx:#e6edf5; --mut:#8494a7; --acc:#3ba3ff;
    --green:#37d67a; --red:#ff5c6c; --amber:#ffb020; --purple:#b088ff; --blue:#4aa8ff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
  h1{font:700 15px var(--mono);margin:0;letter-spacing:.5px}
  h1 span{color:var(--mut);font-weight:400}
  .sub{font:12px var(--mono);color:var(--mut);margin-top:3px}
  button{background:var(--card2);color:var(--tx);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font:600 12px var(--mono);cursor:pointer;flex:none}
  button:active{transform:scale(.97)}
  .banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
  .banner.red{background:rgba(255,92,108,.12);border:1px solid var(--red);color:var(--red)}
  .banner.amber{background:rgba(255,176,32,.1);border:1px solid var(--amber);color:var(--amber)}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  @media(min-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:940px){.tiles{grid-template-columns:repeat(5,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
  .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .v{font:700 20px var(--mono);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v small{font-size:11px;font-weight:500;color:var(--mut)}
  h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 8px}
  .gates{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:700px){.gates{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .card .name{font:700 14px var(--mono)}
  .bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 10px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--mut)}
  .stats b{display:block;font:600 14px var(--mono);color:var(--tx)}
  .why{font-size:12px;color:var(--mut);margin-top:9px;line-height:1.5}
  .badge{font:700 10px var(--mono);padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .b-green{background:rgba(55,214,122,.15);color:var(--green)}
  .b-red{background:rgba(255,92,108,.15);color:var(--red)}
  .b-amber{background:rgba(255,176,32,.15);color:var(--amber)}
  .b-blue{background:rgba(74,168,255,.15);color:var(--blue)}
  .b-purple{background:rgba(176,136,255,.15);color:var(--purple)}
  .b-mut{background:rgba(132,148,167,.15);color:var(--mut)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 10px}
  .tab{font:600 12px var(--mono);padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--mut)}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#04121f}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
  .row .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .row .l{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .time{font:11px var(--mono);color:var(--mut);white-space:nowrap}
  .mkt{font-size:14px;font-weight:600;margin:7px 0 4px;line-height:1.3;word-break:break-word}
  .meta{font:12px var(--mono);color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 14px}
  .meta b{color:var(--tx);font-weight:600}
  .pos{color:var(--green)!important}.neg{color:var(--red)!important}
  .tbl{width:100%;border-collapse:collapse;font:12px var(--mono)}
  .tbl th{color:var(--mut);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
  .tbl td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .scroll{overflow-x:auto}
  .empty,.err{text-align:center;color:var(--mut);padding:34px 10px;font-size:13px;line-height:1.6}
  .err{color:var(--red)}
  .foot{text-align:center;color:var(--mut);font:11px var(--mono);margin-top:22px;line-height:1.7}
  code{font-family:var(--mono)}
  .charts{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:700px){.charts{grid-template-columns:1fr 1fr}.charts .wide{grid-column:1/-1}}
  .chart{position:relative}
  .chart .ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .chart .ttl b{font:600 13px var(--mono)}
  .chart .ttl span{font:12px var(--mono);color:var(--mut)}
  .chart svg{display:block;width:100%;overflow:visible}
  .chart .ax{font:10px var(--mono);fill:var(--mut)}
  .chart .grid{stroke:var(--line);stroke-width:1}
  .chart .zero{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 3}
  .legend{display:flex;gap:14px;font:11px var(--mono);color:var(--mut);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;font:11px var(--mono);color:var(--tx);white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.4);display:none;z-index:2}
  .nodata{color:var(--mut);font-size:12px;text-align:center;padding:30px 6px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .grid2>*,.gates>*,.charts>*{min-width:0}
  @media(min-width:700px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
  .meter{margin:0 0 12px}
  .meter .lbl{display:flex;justify-content:space-between;font:12px var(--mono);margin-bottom:5px}
  .meter .lbl span:last-child{color:var(--mut)}
  .meter .trk{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
  .meter .trk i{display:block;height:100%;border-radius:99px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .chip{font:600 11px var(--mono);padding:5px 10px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--mut)}
  .chip.on{border-color:var(--acc);color:var(--acc)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:12px var(--mono)}
  .kv span:nth-child(odd){color:var(--mut)}
  .kv span:nth-child(even){text-align:right;word-break:break-all}
  .hl{display:flex;justify-content:space-between;gap:10px;font:12px var(--mono);padding:7px 0;border-bottom:1px solid var(--line)}
  .hl:last-child{border-bottom:0}
  .hl .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl td.wrap{white-space:normal;text-align:left;max-width:320px}
  a.w{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div style="min-width:0">
        <h1>NEW-POLYBOT <span>// MONITOR</span></h1>
        <div class="sub" id="sub">memuat…</div>
      </div>
    </div>
    <button id="refresh">↻ REFRESH</button>
  </header>

  <div id="banners"></div>
  <div class="tiles" id="tiles"></div>

  <h2 id="riskH" hidden>Risiko &amp; modal</h2>
  <div class="grid2" id="risk"></div>

  <h2 id="chartsH" hidden>Grafik</h2>
  <div class="charts" id="charts"></div>

  <h2 id="gatesH" hidden>Gerbang live</h2>
  <div class="gates" id="gates"></div>

  <div id="calib"></div>

  <h2 id="brkH" hidden>Rincian PnL</h2>
  <div class="grid2" id="brk"></div>

  <div class="tabs" id="tabs"></div>
  <div id="panel"><div class="empty">memuat data…</div></div>

  <div class="foot">
    sumber: branch <code>data</code> · dashboard.json (repo public) · update tiap ~5 mnt · auto-refresh 60 dtk<br>
    paper trading / simulasi · bukan financial advice
  </div>
</div>

<script>
// ?src=... buat nguji pakai file lain (mis. hasil `npb export` lokal).
const DATA_URL = new URLSearchParams(location.search).get("src")
  || "https://raw.githubusercontent.com/kumaraprayoga68-sketch/new-polybot/refs/heads/data/dashboard.json";
let D = null, TAB = "bets";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd = (x, sign) => (x == null ? "—" : (sign && x > 0 ? "+" : "") + (x < 0 ? "-$" : "$") + Math.abs(x).toFixed(2));
const pct = (x, sign = true) => (x == null ? "—" : (sign && x > 0 ? "+" : "") + (x * 100).toFixed(2) + "%");
const cls = x => (x > 0 ? "pos" : x < 0 ? "neg" : "");
function ago(ts) {
  if (!ts) return "belum pernah";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));   // jam HP vs server bisa beda dikit
  if (s < 60) return s + " dtk lalu";
  if (s < 3600) return Math.floor(s / 60) + " mnt lalu";
  if (s < 86400) return Math.floor(s / 3600) + " jam lalu";
  return Math.floor(s / 86400) + " hari lalu";
}

function renderTop() {
  // last_cycle 0 = siklus pertama belum kelar (run pertama ngukur 100 trader dulu).
  // Patokannya umur data: kalau data masih baru, bot-nya hidup.
  const first = !D.last_cycle;
  const age = Date.now() / 1000 - (first ? D.generated_at : D.last_cycle);
  $("dot").style.background = age < 600 ? "var(--green)" : age < 3600 ? "var(--amber)" : "var(--red)";
  $("dot").style.boxShadow = age < 600 ? "0 0 10px var(--green)" : "none";
  $("sub").textContent = first
    ? `siklus pertama sedang jalan · data ${ago(D.generated_at)}`
    : `siklus terakhir ${ago(D.last_cycle)} · data ${ago(D.generated_at)}`;

  const b = [];
  if (D.killed) b.push(`<div class="banner red">⛔ KILL SWITCH aktif: ${esc(D.killed)} — order baru berhenti</div>`);
  if (age >= 3600) b.push(`<div class="banner amber">⚠️ Bot gak update ${ago(Date.now() / 1000 - age)}. Cek tab Actions di GitHub.</div>`);
  if (D.live_requested) b.push(`<div class="banner amber">🔴 Mode LIVE diminta — cuma strategi yang di-promote yang pakai duit beneran</div>`);
  const rp = D.risk_state && D.risk_state.paper;
  if (rp && rp.brake) b.push(`<div class="banner amber">🧯 Rem rugi 24 jam aktif: rugi ${usd(-rp.loss_24h)} > batas ${usd(rp.loss_limit)} — bet paper baru berhenti sampai rugi lama lewat 24 jam</div>`);
  if (D.summary && D.summary.two_sided_markets) b.push(`<div class="banner amber">↔️ ${D.summary.two_sided_markets} market kepegang DUA sisi (bet lama sebelum perbaikan) — lihat filter "dua sisi" di tab Bet</div>`);
  $("banners").innerHTML = b.join("");

  const open = D.bets.filter(x => !x.resolved).length;
  const c = D.signal_counts_24h || {};
  const take = Object.entries(c).filter(([k]) => k.endsWith(":take")).reduce((a, [, v]) => a + v, 0);
  const skip = Object.entries(c).filter(([k]) => k.endsWith(":skip")).reduce((a, [, v]) => a + v, 0);
  const S = D.summary || {}, R = (D.risk_state || {}).paper || {};
  const tiles = [
    ["Mode", D.mode.toUpperCase(), D.live_requested ? "live diminta" : "aman"],
    ["PnL total paper", `<span class="${cls(S.pnl)}">${usd(S.pnl, true)}</span>`, S.staked ? pct(S.pnl / S.staked) : ""],
    ["PnL 24j paper", `<span class="${cls(D.pnl_24h.paper)}">${usd(D.pnl_24h.paper, true)}</span>`, "realized"],
    ["Belum-realized", R.unrealized == null ? "—" : `<span class="${cls(R.unrealized)}">${usd(R.unrealized, true)}</span>`,
      R.mtm_positions != null ? `${R.mtm_positions} posisi` : ""],
    ["Eksposur paper", usd(D.exposure.paper), `/ $${D.risk.max_exposure_usd}`],
    ["Win rate", S.win_rate == null ? "—" : (S.win_rate * 100).toFixed(1) + "%", S.settled != null ? `${S.wins}M · ${S.losses}K` : ""],
    ["Fee dibayar", usd(S.fees), S.fee_pct != null ? pct(S.fee_pct, false) + " modal" : ""],
    ["Max drawdown", `<span class="neg">${usd(S.max_drawdown)}</span>`, ""],
    ["Bet", S.bets ?? D.bets.length, `${S.open ?? open} open`],
    ["Sinyal 24j", take, `ikut · ${skip} skip`],
  ];
  $("tiles").innerHTML = tiles.map(([k, v, s]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v} <small>${s}</small></div></div>`).join("");
}

// ── grafik (SVG polos, tanpa library) ─────────────────────────────────────
const COL = { take: "#3ba3ff", skip: "#5d6b7d", line: "#3ba3ff", bar: "#3ba3ff" };
const SKIP_LABEL = {
  "slippage": "harga udah lari (slippage)",
  "resolve": "resolve > batas hari",
  "harga": "harga di luar 0.05–0.95",
  "edge": "edge kecil setelah fee",
  "Kelly": "Kelly 0 (gak ada edge)",
  "end date lewat": "tanggal lewat jauh",
  "depth gak cukup": "likuiditas kurang",
  "order book kosong": "order book kosong",
  "market tutup / gak terima order": "market udah tutup",
};
const fmtHour = t => new Date(t * 1000).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
const fmtDate = t => new Date(t * 1000).toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function chartBox(id, title, sub, wide) {
  return `<div class="card chart${wide ? " wide" : ""}" id="${id}">
    <div class="ttl"><b>${title}</b><span>${sub}</span></div><div class="plot"></div><div class="tip"></div></div>`;
}

// Tooltip: posisi relatif kartu, dijaga biar gak keluar kartu.
function showTip(card, html, x, y) {
  const tip = card.querySelector(".tip");
  tip.innerHTML = html; tip.style.display = "block";
  const w = tip.offsetWidth, cw = card.clientWidth;
  tip.style.left = Math.max(4, Math.min(cw - w - 4, x - w / 2)) + "px";
  tip.style.top = Math.max(4, y - tip.offsetHeight - 10) + "px";
}
const hideTip = card => (card.querySelector(".tip").style.display = "none");

function niceTicks(lo, hi, n = 4) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const step0 = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0);
  // batas atas dibulatkan KE ATAS, biar titik tertinggi gak lewat garis teratas
  const out = [], top = Math.ceil(hi / step - 1e-9) * step;
  for (let v = Math.floor(lo / step) * step; v <= top + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}

function drawPnl(card, pts) {
  const plot = card.querySelector(".plot");
  if (pts.length < 2) {
    plot.innerHTML = `<div class="nodata">${pts.length ? "Baru 1 bet settle." : "Belum ada bet yang settle."}
      Grafik muncul setelah bet paper mulai selesai.</div>`;
    return;
  }
  const W = plot.clientWidth, H = 170, L = 44, R = 8, T = 8, B = 20;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const ticks = niceTicks(Math.min(0, ...ys), Math.max(0, ...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1], x0 = xs[0], x1 = xs[xs.length - 1] || x0 + 1;
  const X = t => L + (W - L - R) * (t - x0) / Math.max(1, x1 - x0);
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const last = ys[ys.length - 1];
  plot.innerHTML = `<svg height="${H}" viewBox="0 0 ${W} ${H}">
    ${ticks.map(v => `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>
      <text class="ax" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v < 0 ? "-" : ""}$${Math.abs(v)}</text>`).join("")}
    <text class="ax" x="${L}" y="${H - 4}">${fmtDate(x0)}</text>
    <text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">${fmtDate(x1)}</text>
    <path d="${path}" fill="none" stroke="${COL.line}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(x1)}" cy="${Y(last)}" r="4" fill="${COL.line}" stroke="var(--card)" stroke-width="2"/>
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--mut)" stroke-width="1" visibility="hidden"/>
    <circle class="dot" r="4" fill="${COL.line}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
    <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/>
  </svg>`;
  const svg = plot.querySelector("svg"), xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot");
  const move = e => {
    const r = svg.getBoundingClientRect(), mx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    let i = 0, best = Infinity;
    pts.forEach((p, j) => { const d = Math.abs(X(p[0]) - mx); if (d < best) { best = d; i = j; } });
    const px = X(pts[i][0]), py = Y(pts[i][1]), step = i ? pts[i][1] - pts[i - 1][1] : pts[i][1];
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
    showTip(card, `${fmtDate(pts[i][0])}<br>kumulatif <b>${usd(pts[i][1], true)}</b><br>bet ini ${usd(step, true)}`,
      px + (r.left - card.getBoundingClientRect().left), py + (r.top - card.getBoundingClientRect().top));
  };
  const leave = () => { xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); hideTip(card); };
  svg.addEventListener("mousemove", move); svg.addEventListener("touchstart", move, { passive: true });
  svg.addEventListener("mouseleave", leave);
}

function drawHourly(card, rows) {
  const plot = card.querySelector(".plot");
  rows = rows.slice(-24);
  const W = plot.clientWidth, H = 150, L = 26, R = 4, T = 8, B = 20;
  const max = Math.max(1, ...rows.map(r => r.take + r.skip));
  const ticks = niceTicks(0, max, 3).filter(v => v >= 0 && Number.isInteger(v));
  const top = ticks[ticks.length - 1] || 1;
  const bw = (W - L - R) / rows.length, gap = Math.min(2, bw * 0.2);
  const Y = v => T + (H - T - B) * (1 - v / top);
  const bar = (x, yTop, yBot, c, roundTop) => {
    const h = Math.max(0, yBot - yTop);
    if (h < 0.5) return "";
    const r = roundTop ? Math.min(3, h / 2, (bw - gap) / 2) : 0;
    return `<path d="M${x},${yBot}V${yTop + r}q0,${-r} ${r},${-r}H${x + bw - gap - r}q${r},0 ${r},${r}V${yBot}Z" fill="${c}"/>`;
  };
  plot.innerHTML = `<svg height="${H}" viewBox="0 0 ${W} ${H}">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>
      <text class="ax" x="${L - 5}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join("")}
    ${rows.map((r, i) => {
      const x = L + i * bw + gap / 2, ySkip = Y(r.skip), yAll = Y(r.take + r.skip);
      // skip di bawah, ikut di atas, dipisah celah 2px
      return bar(x, ySkip, Y(0), COL.skip, !r.take) + (r.take ? bar(x, yAll, ySkip - (r.skip ? 2 : 0), COL.take, true) : "");
    }).join("")}
    <text class="ax" x="${L}" y="${H - 4}">${fmtHour(rows[0].t)}</text>
    <text class="ax" x="${W - R}" y="${H - 4}" text-anchor="end">sekarang</text>
    ${rows.map((r, i) => `<rect data-i="${i}" x="${L + i * bw}" y="0" width="${bw}" height="${H - B}" fill="transparent"/>`).join("")}
  </svg>
  <div class="legend"><span><i style="background:${COL.take}"></i>ikut</span><span><i style="background:${COL.skip}"></i>skip</span></div>`;
  plot.querySelectorAll("rect[data-i]").forEach(el => {
    const show = () => {
      const r = rows[+el.dataset.i], b = el.getBoundingClientRect(), c = card.getBoundingClientRect();
      showTip(card, `${fmtHour(r.t)}–${fmtHour(r.t + 3600)}<br>ikut <b>${r.take}</b> · skip <b>${r.skip}</b>`,
        b.left - c.left + b.width / 2, Y(r.take + r.skip) + (b.top - c.top));
    };
    el.addEventListener("mouseenter", show); el.addEventListener("touchstart", show, { passive: true });
    el.addEventListener("mouseleave", () => hideTip(card));

}

function drawReasons(card, rows) {
  const plot = card.querySelector(".plot");
  if (!rows.length) { plot.innerHTML = `<div class="nodata">Gak ada skip dalam 24 jam terakhir.</div>`; return; }
  rows = rows.slice(0, 6);
  const total = rows.reduce((a, r) => a + r.n, 0), max = Math.max(...rows.map(r => r.n));
  plot.innerHTML = rows.map(r => {

        <span>${esc(label)}</span><span style="color:var(--mut)">${r.n} · ${Math.round(r.n / total * 100)}%</span></div>
      <div style="height:8px;background:var(--card2);border-radius:4px;overflow:hidden">

const skipKey = r => (r || "").split(/\s*-?[\d:(]/)[0].trim() || "lainnya";
function fallbackHourly() {
  const now = Math.floor(Date.now() / 1000), start = (Math.floor(now / 3600) - 23) * 3600;
  const rows = Array.from({ length: 24 }, (_, i) => ({ t: start + i * 3600, take: 0, skip: 0 }));
  D.signals.forEach(s => { const i = Math.floor((s.ts - start) / 3600); if (i >= 0 && i < 24 && rows[i][s.decision] !== undefined) rows[i][s.decision]++; });
  return rows;
}
function fallbackReasons() {
  const c = {}, since = Date.now() / 1000 - 86400;
  D.signals.filter(s => s.decision === "skip" && s.ts > since).forEach(s => { const k = skipKey(s.reason); c[k] = (c[k] || 0) + 1; });
  return Object.entries(c).map(([reason, n]) => ({ reason, n })).sort((a, b) => b.n - a.n);
}
function fallbackPnl() {
  let acc = 0;
  return D.bets.filter(b => b.resolved).sort((a, b) => a.ts - b.ts).map(b => [b.ts, (acc += b.pnl)]);
}

function renderCharts() {
  $("chartsH").hidden = false;
  const reasons = D.skip_reasons_24h || fallbackReasons();
  const nSkip = reasons.reduce((a, r) => a + r.n, 0);
  const pnl = D.pnl_curve || fallbackPnl();
  const last = pnl.length ? pnl[pnl.length - 1][1] : 0;
  $("charts").innerHTML =
    chartBox("c-pnl", "PnL kumulatif (paper)", `${pnl.length} settle · <span class="${cls(last)}">${usd(last, true)}</span>`, true) +
    chartBox("c-hour", "Sinyal per jam", "24 jam terakhir") +
    chartBox("c-skip", "Kenapa di-skip", `${nSkip} skip · 24 jam`);
  drawPnl($("c-pnl"), pnl);
  drawHourly($("c-hour"), D.hourly && D.hourly.length ? D.hourly : fallbackHourly());
  drawReasons($("c-skip"), reasons);
}

function drawDaily(card, curve) {
  const plot = card.querySelector(".plot");
  const by = {};
  let prev = 0;
  curve.forEach(([t, cum]) => {
    const k = new Date(t * 1000).toLocaleDateString("id-ID", { day: "numeric", month: "short" });
    by[k] = (by[k] || 0) + (cum - prev); prev = cum;
  });
  const rows = Object.entries(by).slice(-14);
  if (!rows.length) { plot.innerHTML = `<div class="nodata">Belum ada bet yang settle.</div>`; return; }
  const W = plot.clientWidth, H = 150, L = 40, R = 4, T = 8, B = 20;
  const ticks = niceTicks(Math.min(0, ...rows.map(r => r[1])), Math.max(0, ...rows.map(r => r[1])), 3);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const bw = Math.min(60, (W - L - R) / rows.length), gap = Math.min(6, bw * 0.25);
  plot.innerHTML = `<svg height="${H}" viewBox="0 0 ${W} ${H}">
    ${ticks.map(v => `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/>
      <text class="ax" x="${L - 5}" y="${Y(v) + 3}" text-anchor="end">${v < 0 ? "-" : ""}$${Math.abs(v)}</text>`).join("")}
    ${rows.map(([k, v], i) => {
      const x = L + i * bw + gap / 2, a = Y(Math.max(0, v)), b = Y(Math.min(0, v));
      return `<rect x="${x}" y="${a}" width="${Math.max(1, bw - gap)}" height="${Math.max(1, b - a)}" rx="2"
        fill="${v >= 0 ? "var(--green)" : "var(--red)"}"><title>${k}: ${usd(v, true)}</title></rect>
        <text class="ax" x="${x + (bw - gap) / 2}" y="${Y(Math.max(0, v)) - 4}" text-anchor="middle">${usd(v, true)}</text>
        ${rows.length <= 8 || i % 2 === 0 ? `<text class="ax" x="${x + (bw - gap) / 2}" y="${H - 4}" text-anchor="middle">${k}</text>` : ""}`;
    }).join("")}
  </svg>`;
}

    if (!D.drift.length) return empty("Belum ada pengukuran drift (butuh sinyal yang umurnya ≥ 1 jam).");
    P.innerHTML = `<div class="card scroll"><table class="tbl">
      <tr><th>strategi</th><th>keputusan</th><th>horizon</th><th>n</th><th>drift mid rata2</th></tr>
      ${D.drift.map(d => `<tr><td>${esc(d.strategy)}</td><td>${esc(d.decision)}</td><td>+${d.horizon_h}j</td>
        <td>${d.n}</td><td class="${cls(d.avg_drift)}">${(d.avg_drift * 100).toFixed(2)}¢</td></tr>`).join("")}
      </table><div class="why">Perubahan harga tengah setelah sinyal. Positif = harga naik ke arah yang kita beli.</div></div>`;
  } else if (TAB === "settings") {
    const st = D.settings;
    if (!st) return empty("Bot versi ini belum ngekspor setelan.");
    const kv = o => `<div class="kv">${Object.entries(o).map(([k, v]) =>
      `<span>${esc(k)}</span><span>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</span>`).join("")}</div>`;
    P.innerHTML = `<div class="grid2">
      <div class="card"><div class="head"><span class="name">umum &amp; rem</span></div>
        ${kv({ bankroll_usd: st.bankroll_usd, loop_interval_sec: st.loop_interval_sec,
               paper_refresh_book: st.paper_refresh_book, fee_rate_override: st.fee_rate_override, ...D.risk })}</div>
      <div class="card"><div class="head"><span class="name">gerbang live</span></div>${kv(D.gate)}</div>
      <div class="card"><div class="head"><span class="name">copytrade</span></div>${kv(st.copytrade)}</div>
      <div class="card"><div class="head"><span class="name">arbitrage</span></div>${kv(st.arbitrage)}</div>
    </div><div class="why">Diubah lewat env di <code>.github/workflows/bot.yml</code> (atau <code>.env</code> kalau jalan lokal).</div>`;
  } else {
    if (!D.errors.length) return empty("Gak ada error. 👍");
    P.innerHTML = `<div class="list">${D.errors.map(e => `<div class="row">
      <div class="top"><span class="l"><span class="badge ${e.level === "error" ? "b-red" : "b-amber"}">${esc(e.level)}</span>
        <span class="badge b-mut">${esc(e.source)}</span></span><span class="time">${ago(e.ts)}</span></div>
      <div class="meta" style="margin-top:6px;word-break:break-word">${esc(e.message)}</div></div>`).join("")}</div>`;
  }
}

async function load() {
  $("dot").style.background = "var(--amber)";
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (r.status === 404) {
      $("dot").style.background = "var(--mut)";
      $("sub").textContent = "belum ada data";
      $("panel").innerHTML = `<div class="empty">Bot belum pernah publish data.<br>
        Jalankan workflow <b>bot 24/7 (paper)</b> di tab Actions repo new-polybot,<br>data muncul ±2 menit setelahnya.</div>`;
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = await r.json();
    renderTop(); renderRisk(); renderCharts(); renderGates(); renderCalib(); renderBreakdown(); renderTabs(); renderPanel();
  } catch (e) {
    $("dot").style.background = "var(--red)";
    $("sub").textContent = "gagal memuat";
    $("panel").innerHTML = `<div class="err">Gagal ambil data.<br>${esc(e.message)}</div>`;
  }
}
$("refresh").onclick = load;
load();
setInterval(load, 60000);
</script>
</body>
</html>
