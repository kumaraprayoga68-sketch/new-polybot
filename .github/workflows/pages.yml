name: dashboard (GitHub Pages)

# Publish folder dashboard/ ke GitHub Pages tiap kali isinya berubah di main.
# Datanya gak ikut di-deploy: halaman itu fetch dashboard.json dari branch `data`
# langsung, jadi push bot tiap 5 menit gak memicu deploy apa pun.
#
# Sekali aja: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
