name: bot 24/7 (paper)

# Bot jalan terus di GitHub Actions (gratis tanpa batas karena repo public).
#
# Satu job hidup ~5,5 jam (batas Actions 6 jam), lalu nge-dispatch dirinya sendiri.
# Branch `data` (di-force-push, selalu 1 commit — repo gak membengkak) isinya:
#   npb.db.gz       database SQLite, checkpoint tiap 30 menit
#   npb.prev.db.gz  kondisi awal run sebelumnya (buat rollback)
#   dashboard.json  ringkasan buat dashboard web, tiap 5 menit
#
# SELALU paper. Wallet/kunci live JANGAN pernah ditaruh di secrets repo ini.
#
# Secrets (Settings -> Secrets and variables -> Actions), opsional:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
on:
  workflow_dispatch: {}
  schedule:
    # Jaring pengaman kalau self-dispatch gagal. Gak bunuh run yang lagi jalan
    # (cancel-in-progress: false) — cuma antre di belakangnya.
    - cron: "23 */6 * * *"

permissions:
  contents: write   # push snapshot DB ke branch data
  actions: write    # dispatch diri sendiri

concurrency:
  group: npb-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NPB_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      NPB_DB_PATH: data/npb.db
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_MINUTES: "330"
      CHECKPOINT_MINUTES: "30"
      DASH_MINUTES: "5"
      # Copytrade: cuma market yang selesai <= 7 hari (hasil cepat ketahuan), dan
      # kandidat trader lebih banyak. CT_MIN_TRADER_T cuma batas bawah: dengan 300
      # kandidat, koreksi multiple testing (CT_FAMILY_ALPHA) naikin syaratnya ke
      # t ~3.6, plus edge di holdout (market terbaru) harus positif. Kalau hasilnya
      # 0 trader diikuti, itu jawaban jujur — bukan bug.
      CT_MAX_DAYS_TO_RESOLVE: "7"
      CT_LEADERBOARD_POOL: "300"
      CT_MIN_TRADER_T: "1.5"
      CT_MIN_TRADER_MARKETS: "20"
      CT_FOLLOW_TOP: "30"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Pulihkan database dari branch data
        run: |
          mkdir -p data
          # Bedain "branch belum ada" (exit 2) dari "fetch gagal". Kalau gagal
          # dan dilanjut, DB kosong bakal NIMPA data lama di checkpoint pertama.
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then
            echo "Branch data belum ada — mulai DB baru."
          elif [ "$rc" = 0 ]; then
            git fetch --depth 1 origin data
            # Branch bisa ada tanpa DB: run sebelumnya mati sebelum checkpoint
            # pertama (cuma sempat publish dashboard.json).
            if git cat-file -e FETCH_HEAD:npb.db.gz 2>/dev/null; then
              git show FETCH_HEAD:npb.db.gz > /tmp/prev.db.gz
              gunzip -c /tmp/prev.db.gz > data/npb.db
              echo "DB dipulihkan: $(du -h data/npb.db | cut -f1)"
            else
              echo "Branch data belum punya npb.db.gz — mulai DB baru."
            fi
          else
            echo "::error::gagal cek branch data (exit $rc) — stop biar data lama gak ketimpa"
            exit 1
          fi

      - name: Jalankan bot + publish berkala
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=/tmp/datawt
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b data "$D"
          if [ -f /tmp/prev.db.gz ]; then
            cp /tmp/prev.db.gz "$D/npb.db.gz"
            cp /tmp/prev.db.gz "$D/npb.prev.db.gz"
          fi

          # Branch data = selalu 1 commit tanpa parent (force push). Repo lokal $D
          # dipakai ulang sepanjang run, jadi push cuma ngirim file yang berubah.
          #   publish     -> dashboard.json saja (tiap DASH_MINUTES)
          #   publish db  -> + snapshot database (tiap CHECKPOINT_MINUTES)
          publish() {
            python -m npb export "$D/dashboard.json" || return 1
            if [ "${1:-}" = db ]; then
              python -m npb backup /tmp/snap.db || return 1
              gzip -9 -c /tmp/snap.db > "$D/npb.db.gz"
            fi
            git -C "$D" add -A
            tree=$(git -C "$D" write-tree)
            c=$(git -C "$D" -c user.name=npb-bot -c user.email=npb-bot@users.noreply.github.com \
                  commit-tree "$tree" -m "snapshot $(date -u +%FT%TZ) [skip ci]")
            git -C "$D" push -q --force "$URL" "$c:refs/heads/data" || return 1
            echo "📤 publish ${1:-dashboard} $(date -u +%T)"
          }

          python -m npb status
          python -m npb run --loop --telegram &
          PID=$!
          # Run dibatalin (Cancel / run baru) -> simpen DB dulu sebelum mati,
          # biar hasil sejak checkpoint terakhir gak ilang.
          on_cancel() {
            echo "⏹️  dibatalkan — simpan DB dulu"
            kill -TERM "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            publish db || true
            exit 130
          }
          trap on_cancel INT TERM
          start=$(date +%s)
          end=$(( start + RUN_MINUTES * 60 ))
          next_dash=$(( start + CHECKPOINT_MINUTES * 60 ))
          next_db=$(( start + 120 ))              # publish pertama (DB + dashboard) ~2 menit
          while kill -0 "$PID" 2>/dev/null && [ "$(date +%s)" -lt "$end" ]; do
            sleep 20 & wait $!      # `wait` biar trap langsung jalan pas dibatalin
            now=$(date +%s)
            if [ "$now" -ge "$next_db" ]; then
              publish db || echo "⚠️ checkpoint DB gagal"
              next_db=$(( now + CHECKPOINT_MINUTES * 60 ))
              next_dash=$(( now + DASH_MINUTES * 60 ))
            elif [ "$now" -ge "$next_dash" ]; then
              publish || echo "⚠️ publish dashboard gagal"
              next_dash=$(( now + DASH_MINUTES * 60 ))
            fi
          done
          trap - INT TERM
          ran=$(( $(date +%s) - start ))
          kill -TERM "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          publish db
          # Mati cepat = ada yang rusak. Jangan restart terus-terusan; biar job
          # merah dan kelihatan di tab Actions.
          if [ "$ran" -lt 1800 ]; then
            echo "::error::bot berhenti setelah ${ran}s — gak di-restart otomatis"
            exit 1
          fi

      - name: Restart diri sendiri
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${GITHUB_REF_NAME}"
